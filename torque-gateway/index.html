<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Torque Live</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .row { display:flex; gap:20px; margin-bottom:12px; flex-wrap: wrap; align-items: stretch; }
    .card { padding:12px 16px; border:1px solid #ccc; border-radius:10px; min-width:220px; }
    .big { font-size: 28px; font-weight: 700; }
    .muted { color:#666; }
    pre { background:#f6f6f6; padding:12px; border-radius:10px; max-height:260px; overflow:auto; }
    canvas { width: 100%; height: 260px; display:block; }
    .wide { flex: 1 1 700px; min-width: 360px; }
    .small { flex: 0 0 auto; }
    select { font-size: 16px; padding: 6px 8px; }
    .legend { display:flex; gap:14px; align-items:center; margin-top:8px; }
    .dot { width:10px; height:10px; border-radius:999px; display:inline-block; }
  </style>
</head>
<body>
  <h2>Torque stream</h2>

  <div class="row">
    <div class="card small">
      <div class="muted">Status</div>
      <div id="status" class="big">disconnected</div>
      <div style="margin-top:10px;">
        <div class="muted">Slave</div>
        <select id="slaveSelect"></select>
      </div>
    </div>

    <div class="card small">
      <div class="muted">Torque RAW (Nm)</div>
      <div id="torqueRaw" class="big">--</div>
    </div>

    <div class="card small">
      <div class="muted">Torque SMOOTH (Nm)</div>
      <div id="torqueSmooth" class="big">--</div>
    </div>

    <div class="card small">
      <div class="muted">Ratio (%)</div>
      <div id="ratio" class="big">--</div>
    </div>

    <div class="card small">
      <div class="muted">Seq</div>
      <div id="seq" class="big">--</div>
    </div>
  </div>

  <div class="row">
    <div class="card wide">
      <div class="muted" style="margin-bottom:8px;">Torque (last ~10s)</div>
      <canvas id="chart" width="1200" height="320"></canvas>

      <div class="legend">
        <span><span class="dot" style="background:#888;"></span> RAW</span>
        <span><span class="dot" style="background:#111;"></span> SMOOTH</span>
      </div>

      <div class="muted" id="chartInfo" style="margin-top:8px;">--</div>
    </div>
  </div>

  <div class="card">
    <div class="muted">Last message</div>
    <pre id="raw">--</pre>
  </div>

<script>
const statusEl = document.getElementById("status");
const torqueRawEl = document.getElementById("torqueRaw");
const torqueSmoothEl = document.getElementById("torqueSmooth");
const ratioEl  = document.getElementById("ratio");
const seqEl    = document.getElementById("seq");
const rawEl    = document.getElementById("raw");
const infoEl   = document.getElementById("chartInfo");
const slaveSel = document.getElementById("slaveSelect");

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

let ws;

// ---- chart buffer ----
const MAX_POINTS = 1000;      // at 30Hz, ~33s; at 100Hz, ~10s (we throttle to 30Hz)
const times = [];
const rawVals = [];
const smoothVals = [];

let needsRedraw = false;
let lastDraw = 0;

let selectedSlave = null;     // null = auto-first
const seenSlaves = new Set();

function ensureSlaveOption(slave) {
  if (seenSlaves.has(slave)) return;
  seenSlaves.add(slave);

  const opt = document.createElement("option");
  opt.value = String(slave);
  opt.textContent = String(slave);
  slaveSel.appendChild(opt);

  if (selectedSlave === null) {
    selectedSlave = slave;
    slaveSel.value = String(slave);
  }
}

slaveSel.addEventListener("change", () => {
  selectedSlave = parseInt(slaveSel.value, 10);
  // clear chart when switching slave
  times.length = 0;
  rawVals.length = 0;
  smoothVals.length = 0;
  needsRedraw = true;
});

function resizeCanvasToCSS() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(300, Math.floor(rect.width * dpr));
  const h = Math.max(200, Math.floor(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}
window.addEventListener("resize", () => { resizeCanvasToCSS(); drawChart(); });

function pushPoint(tSec, raw, smooth) {
  times.push(tSec);
  rawVals.push(raw);
  smoothVals.push(smooth);

  if (times.length > MAX_POINTS) {
    times.shift(); rawVals.shift(); smoothVals.shift();
  }
  needsRedraw = true;
}

function niceGridStep(range) {
  if (range <= 0) return 1;
  const raw = range / 5;
  const k = Math.pow(10, Math.floor(Math.log10(raw)));
  const r = raw / k;
  const step = (r < 1.5) ? 1*k : (r < 3.5) ? 2*k : (r < 7.5) ? 5*k : 10*k;
  return step;
}

function drawLine(vals, tMin, tMax, vMin, vMax, padL, padT, plotW, plotH) {
  const n = vals.length;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = padL + ((times[i] - tMin) / (tMax - tMin)) * plotW;
    const y = padT + (1 - (vals[i] - vMin) / (vMax - vMin)) * plotH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawChart() {
  resizeCanvasToCSS();
  const w = canvas.width, h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);

  const n = rawVals.length;
  if (n < 2) {
    ctx.fillStyle = "#666";
    ctx.font = `${Math.floor(14 * (window.devicePixelRatio||1))}px system-ui`;
    ctx.fillText("waiting for data…", 16, 24);
    infoEl.textContent = "--";
    return;
  }

  const padL = 60, padR = 20, padT = 16, padB = 28;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  const tMin = times[0];
  const tMax = times[n-1];

  let vMin = Infinity, vMax = -Infinity;
  for (let i = 0; i < n; i++) {
    const a = rawVals[i], b = smoothVals[i];
    if (a < vMin) vMin = a;
    if (a > vMax) vMax = a;
    if (b < vMin) vMin = b;
    if (b > vMax) vMax = b;
  }

  const span = (vMax - vMin) || 1;
  vMin -= span * 0.1;
  vMax += span * 0.1;

  const step = niceGridStep(vMax - vMin);
  const gridMin = Math.floor(vMin / step) * step;
  const gridMax = Math.ceil(vMax / step) * step;

  // grid
  ctx.strokeStyle = "#e9e9e9";
  ctx.lineWidth = 1;
  ctx.fillStyle = "#666";
  ctx.font = `${Math.floor(12 * (window.devicePixelRatio||1))}px system-ui`;

  for (let gv = gridMin; gv <= gridMax + 1e-9; gv += step) {
    const y = padT + (1 - (gv - vMin) / (vMax - vMin)) * plotH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + plotW, y);
    ctx.stroke();
    ctx.fillText(gv.toFixed(2), 6, y + 4);
  }

  // axis box
  ctx.strokeStyle = "#cccccc";
  ctx.lineWidth = 1;
  ctx.strokeRect(padL, padT, plotW, plotH);

  // RAW line (light)
  ctx.strokeStyle = "#888";
  ctx.lineWidth = 2;
  drawLine(rawVals, tMin, tMax, vMin, vMax, padL, padT, plotW, plotH);

  // SMOOTH line (dark)
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  drawLine(smoothVals, tMin, tMax, vMin, vMax, padL, padT, plotW, plotH);

  const secondsShown = (tMax - tMin);
  infoEl.textContent =
    `slave: ${selectedSlave} | points: ${n} | window: ~${secondsShown.toFixed(1)} s | y-range: ${vMin.toFixed(2)} … ${vMax.toFixed(2)} Nm`;
}

function animationLoop(ts) {
  if (needsRedraw && (ts - lastDraw) > 33) {
    drawChart();
    needsRedraw = false;
    lastDraw = ts;
  }
  requestAnimationFrame(animationLoop);
}
requestAnimationFrame(animationLoop);

// ---- WebSocket ----
function connect() {
  ws = new WebSocket("ws://localhost:8765");

  ws.onopen = () => statusEl.textContent = "connected";
  ws.onclose = () => {
    statusEl.textContent = "disconnected";
    setTimeout(connect, 500);
  };
  ws.onerror = () => { statusEl.textContent = "error"; };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.hello) return;

    ensureSlaveOption(msg.slave);

    // filter by selected slave
    if (selectedSlave !== null && msg.slave !== selectedSlave) return;

    const rawNm = (typeof msg.torque_Nm === "number") ? msg.torque_Nm : null;
    const smNm  = (typeof msg.torque_Nm_smooth === "number") ? msg.torque_Nm_smooth : rawNm;

    if (rawNm === null) return;

    torqueRawEl.textContent = rawNm.toFixed(3);
    torqueSmoothEl.textContent = smNm.toFixed(3);
    ratioEl.textContent  = (msg.ratio_pct ?? 0).toFixed(1);
    seqEl.textContent    = msg.seq ?? "--";
    rawEl.textContent    = JSON.stringify(msg, null, 2);

    // prefer relative time from gateway (stable + avoids large unix values)
    const t = (typeof msg.t_rel_s === "number") ? msg.t_rel_s : (Date.now() / 1000);
    pushPoint(t, rawNm, smNm);
  };
}

connect();
</script>
</body>
</html>
