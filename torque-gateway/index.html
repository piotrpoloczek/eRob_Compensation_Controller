<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Torque Live</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .row { display:flex; gap:20px; margin-bottom:12px; flex-wrap: wrap; }
    .card { padding:12px 16px; border:1px solid #ccc; border-radius:10px; min-width:220px; }
    .big { font-size: 28px; font-weight: 700; }
    .muted { color:#666; }
    pre { background:#f6f6f6; padding:12px; border-radius:10px; max-height:260px; overflow:auto; }
    canvas { width: 100%; height: 260px; display:block; }
    .wide { flex: 1 1 700px; min-width: 360px; }
    .small { flex: 0 0 auto; }
  </style>
</head>
<body>
  <h2>Torque stream</h2>

  <div class="row">
    <div class="card small">
      <div class="muted">Status</div>
      <div id="status" class="big">disconnected</div>
    </div>
    <div class="card small">
      <div class="muted">Torque (Nm)</div>
      <div id="torque" class="big">--</div>
    </div>
    <div class="card small">
      <div class="muted">Ratio (%)</div>
      <div id="ratio" class="big">--</div>
    </div>
    <div class="card small">
      <div class="muted">Seq</div>
      <div id="seq" class="big">--</div>
    </div>
  </div>

  <div class="row">
    <div class="card wide">
      <div class="muted" style="margin-bottom:8px;">Torque (last ~10s)</div>
      <canvas id="chart" width="1200" height="320"></canvas>
      <div class="muted" id="chartInfo" style="margin-top:8px;">--</div>
    </div>
  </div>

  <div class="card">
    <div class="muted">Last message</div>
    <pre id="raw">--</pre>
  </div>

<script>
const statusEl = document.getElementById("status");
const torqueEl = document.getElementById("torque");
const ratioEl  = document.getElementById("ratio");
const seqEl    = document.getElementById("seq");
const rawEl    = document.getElementById("raw");
const infoEl   = document.getElementById("chartInfo");

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

let ws;

// ---- chart buffer ----
// Keep last N points (at 100 Hz, 1000 pts = ~10s)
const MAX_POINTS = 1000;
const times = [];
const values = [];

// performance: redraw at most 30 FPS
let needsRedraw = false;
let lastDraw = 0;

function resizeCanvasToCSS() {
  // Make the internal canvas match the rendered size for crisp lines
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(300, Math.floor(rect.width * dpr));
  const h = Math.max(200, Math.floor(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}

window.addEventListener("resize", () => { resizeCanvasToCSS(); drawChart(); });

function pushPoint(tSec, v) {
  times.push(tSec);
  values.push(v);
  if (times.length > MAX_POINTS) {
    times.shift();
    values.shift();
  }
  needsRedraw = true;
}

function niceGridStep(range) {
  // choose 1/2/5 * 10^k
  if (range <= 0) return 1;
  const raw = range / 5; // aim ~5 grid lines
  const k = Math.pow(10, Math.floor(Math.log10(raw)));
  const r = raw / k;
  const step = (r < 1.5) ? 1*k : (r < 3.5) ? 2*k : (r < 7.5) ? 5*k : 10*k;
  return step;
}

function drawChart() {
  resizeCanvasToCSS();
  const w = canvas.width, h = canvas.height;

  // background
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);

  const n = values.length;
  if (n < 2) {
    ctx.fillStyle = "#666";
    ctx.font = `${Math.floor(14 * (window.devicePixelRatio||1))}px system-ui`;
    ctx.fillText("waiting for data…", 16, 24);
    return;
  }

  // padding
  const padL = 60, padR = 20, padT = 16, padB = 28;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  const tMin = times[0];
  const tMax = times[n-1];

  let vMin = Infinity, vMax = -Infinity;
  for (let i = 0; i < n; i++) {
    const v = values[i];
    if (v < vMin) vMin = v;
    if (v > vMax) vMax = v;
  }
  // add headroom
  const span = (vMax - vMin) || 1;
  vMin -= span * 0.1;
  vMax += span * 0.1;

  // grid
  const step = niceGridStep(vMax - vMin);
  const gridMin = Math.floor(vMin / step) * step;
  const gridMax = Math.ceil(vMax / step) * step;

  ctx.strokeStyle = "#e9e9e9";
  ctx.lineWidth = 1;

  ctx.fillStyle = "#666";
  ctx.font = `${Math.floor(12 * (window.devicePixelRatio||1))}px system-ui`;

  for (let gv = gridMin; gv <= gridMax + 1e-9; gv += step) {
    const y = padT + (1 - (gv - vMin) / (vMax - vMin)) * plotH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + plotW, y);
    ctx.stroke();

    // labels
    ctx.fillText(gv.toFixed(2), 6, y + 4);
  }

  // axis box
  ctx.strokeStyle = "#cccccc";
  ctx.lineWidth = 1;
  ctx.strokeRect(padL, padT, plotW, plotH);

  // line
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2;
  ctx.beginPath();

  for (let i = 0; i < n; i++) {
    const x = padL + ((times[i] - tMin) / (tMax - tMin)) * plotW;
    const y = padT + (1 - (values[i] - vMin) / (vMax - vMin)) * plotH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // last point marker
  const xLast = padL + plotW;
  const yLast = padT + (1 - (values[n-1] - vMin) / (vMax - vMin)) * plotH;
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(xLast, yLast, 4, 0, Math.PI * 2);
  ctx.fill();

  // time label
  const secondsShown = (tMax - tMin);
  infoEl.textContent = `points: ${n} | window: ~${secondsShown.toFixed(1)} s | y-range: ${vMin.toFixed(2)} … ${vMax.toFixed(2)} Nm`;
}

function animationLoop(ts) {
  // redraw at most ~30 fps
  if (needsRedraw && (ts - lastDraw) > 33) {
    drawChart();
    needsRedraw = false;
    lastDraw = ts;
  }
  requestAnimationFrame(animationLoop);
}
requestAnimationFrame(animationLoop);

// ---- WebSocket ----
function connect() {
  ws = new WebSocket("ws://localhost:8765");

  ws.onopen = () => statusEl.textContent = "connected";
  ws.onclose = () => {
    statusEl.textContent = "disconnected";
    setTimeout(connect, 500);
  };
  ws.onerror = () => { statusEl.textContent = "error"; };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.hello) return;

    torqueEl.textContent = msg.torque_Nm.toFixed(3);
    ratioEl.textContent  = msg.ratio_pct.toFixed(1);
    seqEl.textContent    = msg.seq;
    rawEl.textContent    = JSON.stringify(msg, null, 2);

    // use msg.ts (unix seconds) if provided, otherwise local time
    const t = (typeof msg.ts === "number") ? msg.ts : (Date.now() / 1000);
    pushPoint(t, msg.torque_Nm);
  };
}

connect();
</script>
</body>
</html>
